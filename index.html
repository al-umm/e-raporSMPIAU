<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>E-Rapor SMP Islam Al-Umm</title>
  <link rel="icon" href="https://iili.io/qqdpAes.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden;
    }

    .iframe-container {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Floating button penolong jika iframe diblokir browser */
    .fallback-btn {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 12px;
      text-decoration: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(4px);
    }
    .fallback-btn:hover {
      background: #0f172a;
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbypSXD0nB9pTwGCI97UP53gsgucS5-PfWbQQDHuthrViBZko5qs5-Mifow6uvkLIEThwA/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      sandbox="allow-forms allow-modals allow-popups-to-escape-sandbox allow-popups allow-scripts allow-same-origin"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>

  <!-- Bantuan jika guru mengalami bentrokan akun Google -->
  <a 
    class="fallback-btn" 
    href="https://script.google.com/macros/s/AKfycbypSXD0nB9pTwGCI97UP53gsgucS5-PfWbQQDHuthrViBZko5qs5-Mifow6uvkLIEThwA/exec" 
    target="_blank">
    <span>⚠️ Tampilan Error? Klik untuk Buka Langsung</span>
  </a>

</body>
</html>
